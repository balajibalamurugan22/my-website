<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#040711" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="4" />

  <!-- Core Neon Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#7000ff" stroke-width="6" stroke-dasharray="16 12" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.4" />

  <!-- Central Star / Genie Core -->
  <path d="M256 96 L296 216 L416 256 L296 296 L256 416 L216 296 L96 256 L216 216 Z" 
        fill="url(#neonCyan)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glow)" />

  <!-- Orbiting Quantum Sparks -->
  <circle cx="160" cy="180" r="8" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="352" cy="332" r="8" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="340" cy="170" r="6" fill="#ec4899" filter="url(#glow)" />
  <circle cx="172" cy="342" r="6" fill="#ec4899" filter="url(#glow)" />
</svg>
