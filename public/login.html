<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIFEGENIE – Access Neural Stream | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <!-- Ambient Sci-Fi Background Glows -->
  <div class="ambient-grid"></div>
  <div class="ambient-aura cyan-aura"></div>
  <div class="ambient-aura purple-aura"></div>

  <div class="auth-viewport">
    <div class="auth-container">
      
      <div class="auth-card">
        <!-- Header & Core Canvas -->
        <div class="auth-header">
          <div class="auth-core-canvas-wrap">
            <canvas id="auth-core-canvas" width="80" height="80"></canvas>
          </div>
          <div class="auth-brand">LIFEGENIE</div>
          <div class="auth-subtitle">Your Life, Your AI – Neural Stream Access</div>
        </div>

        <!-- Alert Notification Box -->
        <div class="auth-alert" id="auth-alert">
          <span id="auth-alert-icon">⚠️</span>
          <span id="auth-alert-msg"></span>
        </div>

        <!-- Tab Toggle Bar -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab-btn active" id="tab-login" role="tab" aria-selected="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            Sign In
          </button>
          <button class="auth-tab-btn" id="tab-register" role="tab" aria-selected="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            Create Account
          </button>
        </div>

        <!-- ================================================================
             1. SIGN IN FORM
             ================================================================ -->
        <form class="auth-form active" id="form-login" novalidate>
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <div class="input-icon-wrap">
              <input 
                type="email" 
                id="login-email" 
                class="form-control" 
                placeholder="explorer@lifegenie.ai" 
                required 
                autocomplete="email"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-icon-wrap">
              <input 
                type="password" 
                id="login-password" 
                class="form-control" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <button type="button" class="btn-toggle-pwd" data-target="login-password" aria-label="Toggle password visibility">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-row-between">
            <label class="remember-label">
              <input type="checkbox" id="login-remember" checked>
              <span>Remember me</span>
            </label>
            <a class="forgot-link" id="link-forgot-pwd">Forgot password?</a>
          </div>

          <button type="submit" class="btn-auth-submit" id="btn-submit-login">
            <span class="btn-text">Connect to LIFEGENIE</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <!-- ================================================================
             2. CREATE ACCOUNT FORM
             ================================================================ -->
        <form class="auth-form" id="form-register" novalidate>
          <div class="form-group">
            <label for="reg-name">Full Name / Callsign</label>
            <div class="input-icon-wrap">
              <input 
                type="text" 
                id="reg-name" 
                class="form-control" 
                placeholder="e.g. Alex Vance" 
                required 
                autocomplete="name"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <div class="input-icon-wrap">
              <input 
                type="email" 
                id="reg-email" 
                class="form-control" 
                placeholder="alex@domain.com" 
                required 
                autocomplete="email"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-password">Create Password (min. 6 characters)</label>
            <div class="input-icon-wrap">
              <input 
                type="password" 
                id="reg-password" 
                class="form-control" 
                placeholder="••••••••" 
                required 
                autocomplete="new-password"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <button type="button" class="btn-toggle-pwd" data-target="reg-password" aria-label="Toggle password visibility">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-confirm-password">Confirm Password</label>
            <div class="input-icon-wrap">
              <input 
                type="password" 
                id="reg-confirm-password" 
                class="form-control" 
                placeholder="••••••••" 
                required 
                autocomplete="new-password"
              >
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            </div>
          </div>

          <button type="submit" class="btn-auth-submit" id="btn-submit-register">
            <span class="btn-text">Initialize AI Account</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <polyline points="17 11 19 13 23 9"></polyline>
            </svg>
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span>OR QUICK ACCESS</span>
        </div>

        <!-- Quick Access Options -->
        <div class="auth-quick-actions">
          <button type="button" class="btn-quick-guest" id="btn-quick-guest">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            ⚡ Continue as Guest Explorer (1-Click)
          </button>
          
          <button type="button" class="btn-fill-demo" id="btn-fill-demo">
            🔑 Auto-fill Demo Account (explorer@lifegenie.ai)
          </button>
        </div>

      </div>

      <div class="auth-footer">
        LIFEGENIE Neural Platform v2.4 • Secured with Scrypt & Google Gemini API
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // 1. Check if already authenticated; if so, proceed to dashboard
    LIFEGENIE_AUTH.requireGuest();

    // 2. Mini Canvas Visualizer Animation
    (function initMiniCanvas() {
      const canvas = document.getElementById('auth-core-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let angle = 0;

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // Glowing core
        const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 32);
        grad.addColorStop(0, '#00f0ff');
        grad.addColorStop(0.4, 'rgba(139, 92, 246, 0.7)');
        grad.addColorStop(1, 'rgba(0, 240, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, 30, 0, Math.PI * 2);
        ctx.fill();

        // Orbit ring 1
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.65)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 32, 14, Math.PI / 4, 0, Math.PI * 2);
        ctx.stroke();

        // Orbit particle 1
        const p1x = Math.cos(angle * 2) * 32;
        const p1y = Math.sin(angle * 2) * 14;
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.arc(p1x, p1y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Orbit ring 2
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-angle * 1.3);
        ctx.strokeStyle = 'rgba(139, 92, 246, 0.65)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 32, 14, -Math.PI / 4, 0, Math.PI * 2);
        ctx.stroke();

        // Orbit particle 2
        const p2x = Math.cos(-angle * 2) * 32;
        const p2y = Math.sin(-angle * 2) * 14;
        ctx.fillStyle = '#c084fc';
        ctx.beginPath();
        ctx.arc(p2x, p2y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        angle += 0.025;
        requestAnimationFrame(render);
      }
      render();
    })();

    // 3. Tab Switching
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const alertBox = document.getElementById('auth-alert');
    const alertMsg = document.getElementById('auth-alert-msg');
    const alertIcon = document.getElementById('auth-alert-icon');

    function showAlert(message, type = 'error') {
      alertBox.className = `auth-alert ${type}`;
      alertIcon.innerText = type === 'success' ? '✓' : '⚠️';
      alertMsg.innerText = message;
      alertBox.style.display = 'flex';
      if (window.cyberAudio) {
        if (type === 'success') window.cyberAudio.playSuccess?.();
        else window.cyberAudio.playError?.();
      }
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabLogin.setAttribute('aria-selected', 'true');
      tabRegister.classList.remove('active');
      tabRegister.setAttribute('aria-selected', 'false');
      formLogin.classList.add('active');
      formRegister.classList.remove('active');
      hideAlert();
      if (window.cyberAudio) window.cyberAudio.playClick?.();
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabRegister.setAttribute('aria-selected', 'true');
      tabLogin.classList.remove('active');
      tabLogin.setAttribute('aria-selected', 'false');
      formRegister.classList.add('active');
      formLogin.classList.remove('active');
      hideAlert();
      if (window.cyberAudio) window.cyberAudio.playClick?.();
    });

    // 4. Password Toggle
    document.querySelectorAll('.btn-toggle-pwd').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.innerHTML = isPassword 
          ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
          : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      });
    });

    // 5. Pre-fill Demo Button
    document.getElementById('btn-fill-demo').addEventListener('click', () => {
      tabLogin.click();
      document.getElementById('login-email').value = 'explorer@lifegenie.ai';
      document.getElementById('login-password').value = 'genie123';
      showAlert('Demo credentials filled. Click "Connect to LIFEGENIE" to enter!', 'success');
    });

    // 6. Forgot Password Helper
    document.getElementById('link-forgot-pwd').addEventListener('click', (e) => {
      e.preventDefault();
      showAlert('Password reset: You can sign in using Demo mode (explorer@lifegenie.ai / genie123) or register a new account.', 'success');
    });

    // 7. Handle Login Submit
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;
      const submitBtn = document.getElementById('btn-submit-login');

      if (!email || !password) {
        showAlert('Please enter both your email and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<div class="spinner-btn"></div> <span>Authenticating...</span>`;

      try {
        const res = await LIFEGENIE_AUTH.login(email, password, remember);
        showAlert(`Authenticated! Connecting as ${res.user.name}...`, 'success');
        if (window.cyberAudio) window.cyberAudio.playSuccess?.();
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } catch (err) {
        showAlert(err.message || 'Login failed. Check your credentials.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Connect to LIFEGENIE</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
      }
    });

    // 8. Handle Register Submit
    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPwd = document.getElementById('reg-confirm-password').value;
      const submitBtn = document.getElementById('btn-submit-register');

      if (!name || name.length < 2) {
        showAlert('Please enter your name (at least 2 characters).');
        return;
      }
      if (!email || !email.includes('@')) {
        showAlert('Please enter a valid email address.');
        return;
      }
      if (!password || password.length < 6) {
        showAlert('Password must be at least 6 characters long.');
        return;
      }
      if (password !== confirmPwd) {
        showAlert('Passwords do not match. Please verify.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<div class="spinner-btn"></div> <span>Creating Profile...</span>`;

      try {
        const res = await LIFEGENIE_AUTH.register(name, email, password);
        showAlert(`Welcome ${res.user.name}! Neural link established.`, 'success');
        if (window.cyberAudio) window.cyberAudio.playSuccess?.();
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 700);
      } catch (err) {
        showAlert(err.message || 'Registration failed.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Initialize AI Account</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>`;
      }
    });

    // 9. Handle Guest Login
    document.getElementById('btn-quick-guest').addEventListener('click', async () => {
      hideAlert();
      const guestBtn = document.getElementById('btn-quick-guest');
      guestBtn.disabled = true;
      guestBtn.innerHTML = `<div class="spinner-btn"></div> <span>Connecting as Guest...</span>`;

      try {
        await LIFEGENIE_AUTH.guestLogin();
        showAlert('Welcome Guest Explorer! Teleporting...', 'success');
        if (window.cyberAudio) window.cyberAudio.playSuccess?.();
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } catch (err) {
        showAlert(err.message || 'Guest sign-in failed.');
        guestBtn.disabled = false;
        guestBtn.innerHTML = `⚡ Continue as Guest Explorer (1-Click)`;
      }
    });
  </script>
</body>
</html>
